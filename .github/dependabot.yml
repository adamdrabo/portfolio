version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: preprod
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: preprod
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: preprod
    schedule:
      interval: weekly